{% extends "base.html" %}
{% block content %}
  <h2>Add Post</h2>
  <form method="post" class="form">
    <div class="field">
      <label>Title</label>
      <input type="text" name="title" class="input">
    </div>
    <div class="field">
      <label>Content</label>
      <textarea name="content"></textarea>
    </div>
    <button type="submit" class="btn">Save</button>
  </form>
{% endblock %}
