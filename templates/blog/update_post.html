{% extends "base.html" %}
{% block content %}
  <h2>Edit Post</h2>
  <form method="post" class="form">
    <div class="field">
      <label>Title</label>
      <input type="text" name="title" value="{{ post.title }}" class="input">
    </div>
    <div class="field">
      <label>Content</label>
      <textarea name="content">{{ post.content }}</textarea>
    </div>
    <button type="submit" class="btn">Update</button>
  </form>
{% endblock %}
